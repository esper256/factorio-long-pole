[mod-name]
long-pole=Long Pole

[mod-description]
long-pole=Speedrun planning and long-pole analysis for Factorio.

[controls]
long-pole-toggle-debug-window=Toggle debug window
long-pole-advance-split=Advance to next split
long-pole-rewind-split=Rewind to previous split

[mod-setting-name]
long-pole-auto-load-first-plan=Auto-load first speedrun plan
long-pole-auto-advance-split=Auto advance to next split
long-pole-put-current-split-in-quickbar=Put current split on quickbar

[mod-setting-description]
long-pole-auto-load-first-plan=Load the first [LP] blueprint book in your library when a run starts.
long-pole-auto-advance-split=Advance when the current split's blueprint is placed and its research is consumed in labs. Next-split production does not gate this.
long-pole-put-current-split-in-quickbar=Put the current split's blueprint or blueprint book in the rightmost slot of your visible quickbar.
