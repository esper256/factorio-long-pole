[mod-name]
internal-mod-name=The Long Pole - Speedrun Planner

[mod-description]
internal-mod-name=Create a speedrun plan and see what is the long pole preventing your run from proceeding faster

[mod-setting-name]
long-pole-auto-import-first-plan-on-new-game=Auto-import first plan book on new game
long-pole-split-viewer-icon-limit=Split viewer icon limit

[mod-setting-description]
long-pole-auto-import-first-plan-on-new-game=When enabled, a new save automatically imports the first Long Pole plan book found in the creating player's blueprint library.
long-pole-split-viewer-icon-limit=Maximum number of progress icons shown per group in the split viewer before an overflow label like "... +3" is shown.

[controls]
long-pole-advance-split=Advance split
long-pole-rewind-split=Go back one split

